<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zcomposer</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Zcomposer</h1>
      <nav aria-label="Visualização">
        <button id="studio" type="button" aria-pressed="true">Studio</button>
        <button id="office" type="button" aria-pressed="false">Office</button>
      </nav>
    </header>
    <main>
      <form id="turn">
        <label for="turn-mode">Ação do Codex</label>
        <select id="turn-mode">
          <option value="task">Enviar tarefa</option>
          <option value="review">Revisar commit</option>
        </select>
        <label id="turn-label" for="prompt">Tarefa para o Codex</label>
        <small id="turn-help">Somente leitura</small>
        <div class="input-row">
          <input id="prompt" required maxlength="4096" aria-describedby="turn-help" placeholder="Descreva o que você quer entender">
          <input id="revision" disabled hidden required value="HEAD" maxlength="512" aria-describedby="turn-help" placeholder="HEAD ou hash do commit">
          <button id="start" type="submit">Iniciar turno</button>
          <button id="interrupt" type="button" hidden>Interromper</button>
        </div>
      </form>
      <p id="status" role="status"></p>
      <div class="board-heading">
        <div>
          <h2 id="heading">Sessões do Studio</h2>
          <p id="board-help"></p>
        </div>
        <span id="session-count"></span>
      </div>
      <p id="layout-status" class="visually-hidden" role="status"></p>
      <p id="layout-save" role="status"></p>
      <ul id="sessions" aria-labelledby="heading" aria-describedby="board-help"></ul>
      <section id="detail" hidden aria-labelledby="detail-title">
        <h2 id="detail-title"></h2>
        <h3>Tarefa</h3>
        <p id="detail-task" class="detail-task"></p>
        <h3>Histórico de estados</h3>
        <ol id="session-history" class="session-history"></ol>
        <p id="history-error" role="status"></p>
        <h3 id="answer-heading" hidden>Resposta</h3>
        <pre id="answer" hidden></pre>
        <div id="review-decision" hidden>
          <h3>Decisão da revisão</h3>
          <p id="review-decision-status" role="status"></p>
          <div id="review-decision-actions" hidden>
            <button id="approve-review" type="button">Aprovar revisão</button>
            <button id="reject-review" type="button">Solicitar ajustes</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
